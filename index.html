<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123B66">
  <title>إدارة مخزن بيبسي</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/trips.css">
  <link rel="stylesheet" href="css/customers.css">
  <link rel="stylesheet" href="css/purchases.css">
  <link rel="stylesheet" href="css/expenses.css">
  <link rel="stylesheet" href="css/reports.css">
  <link rel="stylesheet" href="css/pledges.css">
  <script src="js/storageService.js" defer></script>
  <script src="js/services/inventoryService.js" defer></script>
  <script src="js/services/purchaseService.js" defer></script>
  <script src="js/services/bonusService.js" defer></script>
  <script src="js/services/tripService.js" defer></script>
  <script src="js/services/customerService.js" defer></script>
  <script src="js/services/invoiceService.js" defer></script>
  <script src="js/services/expenseService.js" defer></script>
  <script src="js/services/reportService.js" defer></script>
  <script src="js/services/pledgeService.js" defer></script>
  <script src="js/modules/inventory.js" defer></script>
  <script src="js/modules/purchases.js" defer></script>
  <script src="js/modules/trips.js" defer></script>
  <script src="js/modules/customers.js" defer></script>
  <script src="js/modules/expenses.js" defer></script>
  <script src="js/modules/reports.js" defer></script>
  <script src="js/modules/pledges.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="القائمة الرئيسية">
      <a class="brand" href="#dashboard" aria-label="إدارة مخزن بيبسي - لوحة التحكم">
        <span class="brand__mark" aria-hidden="true">P</span>
        <span class="brand__text">
          <strong>إدارة المخزن</strong>
          <small>نظام التوزيع والمبيعات</small>
        </span>
      </a>

      <nav class="navigation" aria-label="أقسام النظام">
        <button class="navigation__item is-active" type="button" data-page="dashboard" aria-current="page">لوحة التحكم</button>
        <button class="navigation__item" type="button" data-page="inventory">الأصناف والمخزون</button>
        <button class="navigation__item" type="button" data-page="trips">الطلعات</button>
        <button class="navigation__item" type="button" data-page="customers">العملاء</button>
        <button class="navigation__item" type="button" data-page="purchases">حساب الشركة</button>
        <button class="navigation__item" type="button" data-page="expenses">المصروفات</button>
        <button class="navigation__item" type="button" data-page="reports">التقارير والتصفية</button>
        <button class="navigation__item" type="button" data-page="pledges">الرهن</button>
      </nav>

    </aside>

    <div class="workspace">
      <header class="topbar">
        <div>
          <p class="topbar__eyebrow">نظام إدارة المخزن والتوزيع</p>
          <h1 class="topbar__title" id="page-title">لوحة التحكم</h1>
        </div>
      </header>

      <main class="page-content" id="page-content" tabindex="-1">
        <section class="welcome-panel" aria-labelledby="welcome-title">
          <div>
            <p class="welcome-panel__eyebrow">مرحبًا بك</p>
            <h2 id="welcome-title">ملخص العمل اليومي</h2>
            <p class="welcome-panel__text">ستظهر مؤشرات النظام هنا بعد تنفيذ تسجيل البيانات والحركات.</p>
          </div>
          <div class="welcome-panel__illustration" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </section>

        <section class="empty-state" aria-labelledby="empty-title">
          <div class="empty-state__icon" aria-hidden="true">—</div>
          <h2 id="empty-title">لا توجد بيانات مسجلة بعد</h2>
          <p>لم تتم إضافة أصناف أو حركات حتى الآن. لن تُعرض أرقام تقديرية على أنها بيانات فعلية.</p>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
